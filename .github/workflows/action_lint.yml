name: Lint for workflows
on:
  push:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@6a9ff88b9bb9c12ff3d7340e267f0f59effaa7cd # v1.80.1
        with:
          reporter: github-check
          fail_level: warning
          filter_mode: nofilter
