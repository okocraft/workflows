name: Lint for workflows
on:
  push:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          reporter: github-check
          fail_level: warning
          filter_mode: nofilter
